<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef"><title>今日重點</title>
<meta name="description" content="東京單車騎旅：自動打開今天（日本時間）的一日一頁重點">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f24;--line:#e2ddd2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--card:#1f2228;--ink:#eceae5;--line:#33363d;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grid a{display:block;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700}
</style></head><body>
<main>
<h1 style="font-size:22px;margin:0">今日重點</h1>
<p id="msg">正在打開今天的行程…</p>
<div class="grid" id="days"></div>
</main>
<script>
// Shows today's day card (Japan time) in place, so a home-screen bookmark of /today keeps working every day.
(function () {
  var grid = document.getElementById('days');
  for (var i = 1; i <= 19; i++) {
    var a = document.createElement('a'); a.href = '../daily/day' + i + '.html'; a.textContent = 'Day ' + i; grid.appendChild(a);
  }
  var jst = new Date(Date.now() + 9 * 3600 * 1000);
  var today = Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate());
  var n = Math.round((today - Date.UTC(2026, 10, 13)) / 86400000) + 1;   // Day 1 = 2026-11-13
  n = Math.min(19, Math.max(1, n));
  fetch('../daily/day' + n + '.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      html = html.replace(/href="day(\d+)\.html"/g, 'href="../daily/day$1.html"');
      document.open(); document.write(html); document.close();
    })
    .catch(function () {
      document.getElementById('msg').textContent = '沒有網路或讀取失敗，請直接點下面的天數。';
    });
})();
</script>
</body></html>
