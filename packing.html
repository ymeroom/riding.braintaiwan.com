/* Layout: one narrow column like a ride card — condition strip, progress, filter tabs, then grouped checklists */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18222f; --muted:#5d6876; --line:#d7dde4;
  --ai:#1f3f72;      /* 藍 indigo: primary */
  --ai-soft:#e3e9f3;
  --kaki:#c9681e;    /* 柿 persimmon: must-bring */
  --kaki-soft:#f8e9dc;
  --ask:#2f6f68;     /* ask CycleTrip */
  --ask-soft:#dfeeec;
  --done:#8a95a3;
  --f-display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161f; --surface:#18212d; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2b3644;
  --ai:#8fb0e6; --ai-soft:#22324a; --kaki:#f0a060; --kaki-soft:#3a2a1c; --ask:#7cc3b9; --ask-soft:#1d3532; --done:#6d7886;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#18212d; --ink:#e6ebf1; --muted:#9aa6b4; --line:#2b3644;
  --ai:#8fb0e6; --ai-soft:#22324a; --kaki:#f0a060; --kaki-soft:#3a2a1c; --ask:#7cc3b9; --ask-soft:#1d3532; --done:#6d7886;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}

<script id="app">
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var LS_STATE = "jp-ride-pack-state-v1", LS_FILTER = "jp-ride-pack-filter";
  var checked = new Set();
  var filter = "all";
  var art = null, mode = "loading";
  var timer = null, inflight = false, dirty = false, delay = 2500, retried = false;

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  function allItems(){ var a=[]; DATA.forEach(function(c){ c.items.forEach(function(it){ a.push(it); }); }); return a; }

  function setStatus(s, text){
    var el = document.getElementById("status");
    el.dataset.s = s; el.textContent = text;
  }

  function render(){
    var html = "";
    DATA.forEach(function(cat){
      var items = cat.items.filter(function(it){
        if (filter === "todo") return !checked.has(it[0]);
        if (filter === "ask") return it[2].indexOf("q") >= 0;
        return true;
      });
      var done = cat.items.filter(function(it){ return checked.has(it[0]); }).length;
      if (!items.length && filter !== "all") return;
      html += '<section class="cat" aria-labelledby="h-'+cat.id+'"><h2 id="h-'+cat.id+'"><span>'+esc(cat.title)+'</span><span class="n'+(done===cat.items.length?' full':'')+'">'+done+' / '+cat.items.length+'</span></h2>';
      if (cat.intro) html += '<p class="intro">'+esc(cat.intro)+'</p>';
      html += '<ul>';
      items.forEach(function(it){
        var id = it[0], flags = it[2], note = it[3], warn = it[4] === "warn";
        html += '<li><label class="item" for="i-'+id+'"><input type="checkbox" id="i-'+id+'" data-id="'+id+'"'+(checked.has(id)?' checked':'')+'><span class="box" aria-hidden="true"></span><span class="txt"><span class="name"><span>'+esc(it[1])+'</span>'
          + (flags.indexOf("m")>=0 ? '<span class="badge b-m">必帶</span>' : '')
          + (flags.indexOf("q")>=0 ? '<span class="badge b-q">問 CycleTrip</span>' : '')
          + '</span>' + (note ? '<span class="note'+(warn?' warn':'')+'">'+esc(note)+'</span>' : '') + '</span></label></li>';
      });
      html += '</ul></section>';
    });
    if (!html) html = '<p class="empty">這個篩選裡的項目都準備好了。</p>';
    document.getElementById("list").innerHTML = html;
    renderProgress();
  }

  function renderProgress(){
    var all = allItems(), done = all.filter(function(it){ return checked.has(it[0]); }).length;
    document.getElementById("pnum").innerHTML = done + '<small> / ' + all.length + ' 項</small>';
    document.getElementById("pbar").style.width = (all.length ? Math.round(done/all.length*100) : 0) + "%";
  }

  function stateJSON(){ return JSON.stringify({ checked: Array.from(checked), updated: new Date().toISOString() }); }

  function schedule(){
    lsSet(LS_STATE, stateJSON());
    if (mode !== "sync"){ return; }
    dirty = true;
    setStatus("saving", "等你停手後儲存…");
    clearTimeout(timer);
    timer = setTimeout(save, delay);
  }

  function save(){
    if (inflight || !art) return;
    inflight = true; dirty = false;
    setStatus("saving", "儲存中…");
    art.publish({ "state.json": { content: stateJSON(), contentType: "application/json" } }).then(function(){
      inflight = false; retried = false;
      if (dirty){ clearTimeout(timer); timer = setTimeout(save, delay); }
      else setStatus("saved", "已同步，手機和電腦都看得到");
    }, function(err){
      inflight = false;
      var code = err && err.code;
      if (code === "conflict"){ setStatus("saving", "有新版本，重新載入中…"); return; }
      if (code === "rate_limited"){ delay = 10000; dirty = true; clearTimeout(timer); timer = setTimeout(save, delay); setStatus("saving", "稍後再儲存…"); return; }
      if (code === "upstream_error" && !retried){ retried = true; dirty = true; clearTimeout(timer); timer = setTimeout(save, 1000 + Math.random()*2000); return; }
      mode = "local";
      if (code === "not_writer" || code === "not_granted" || code === "consent_required") setStatus("local", "唯讀檢視，勾選只存在這台裝置");
      else setStatus("local", "無法同步，勾選先存在這台裝置");
    });
  }

  document.getElementById("list").addEventListener("change", function(e){
    var t = e.target; if (!t || !t.dataset || !t.dataset.id) return;
    if (t.checked) checked.add(t.dataset.id); else checked.delete(t.dataset.id);
    if (filter === "todo" && t.checked){ setTimeout(render, 350); } else { render(); var el=document.getElementById("i-"+t.dataset.id); if (el) el.focus(); }
    schedule();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){
      filter = b.dataset.f; lsSet(LS_FILTER, filter);
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
      render();
    });
  });

  var resetBtn = document.getElementById("reset"), armTimer = null;
  resetBtn.addEventListener("click", function(){
    if (resetBtn.dataset.armed !== "1"){
      resetBtn.dataset.armed = "1"; resetBtn.textContent = "再按一次，清除全部勾選";
      clearTimeout(armTimer); armTimer = setTimeout(function(){ resetBtn.dataset.armed = "0"; resetBtn.textContent = "全部取消勾選"; }, 4000);
      return;
    }
    clearTimeout(armTimer); resetBtn.dataset.armed = "0"; resetBtn.textContent = "全部取消勾選";
    checked.clear(); render(); schedule();
  });

  document.addEventListener("visibilitychange", function(){
    if (document.hidden && dirty && mode === "sync" && !inflight){ clearTimeout(timer); save(); }
  });

  function applyState(obj){
    if (obj && Array.isArray(obj.checked)) checked = new Set(obj.checked.filter(function(x){ return typeof x === "string"; }));
  }

  // Start: local copy first (instant), then the published state, then try to enable sync.
  var f = lsGet(LS_FILTER); if (f === "todo" || f === "ask") filter = f;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-pressed", x.dataset.f===filter ? "true" : "false"); });
  try { applyState(JSON.parse(lsGet(LS_STATE) || "null")); } catch(e){}
  render();

  var served = fetch("state.json", { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  var cap = (window.claude && typeof window.claude.use === "function") ? window.claude.use("artifact").catch(function(){ return null; }) : Promise.resolve(null);

  served.then(function(s){
    return cap.then(function(a){
      if (a){
        art = a; mode = "sync";
        if (s){ applyState(s); lsSet(LS_STATE, JSON.stringify(s)); }
        render();
        setStatus("saved", "已同步，手機和電腦都看得到");
      } else {
        mode = "local";
        if (!lsGet(LS_STATE) && s){ applyState(s); render(); }
        setStatus("local", "勾選只存在這台裝置");
      }
    });
  });
})();
</script>

</body></html>
