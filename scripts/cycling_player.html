<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>東京單車騎旅 19日主題曲 ｜ 單車動態歌詞播放器 (38首雙主唱雙風格)</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --card-bg: #131D2F;
            --card-hover: #1E293B;
            --border-color: #233554;
            --primary: #2563EB;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent-gold: #F59E0B;
            --accent-cyan: #38BDF8;
            --accent-emerald: #10B981;
            --accent-purple: #A855F7;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --lyrics-inactive: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            background: rgba(19, 29, 47, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title h1 {
            font-size: 16px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }

        .brand-title p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--primary);
        }

        /* Day Selector Ribbon */
        .day-ribbon-container {
            background: #0E1626;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 14px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .day-ribbon-container::-webkit-scrollbar {
            height: 4px;
        }

        .day-ribbon-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }

        .day-ribbon {
            display: inline-flex;
            gap: 8px;
        }

        .day-pill {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .day-pill:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        .day-pill.active {
            background: linear-gradient(135deg, var(--primary), #1D4ED8);
            color: #FFFFFF;
            border-color: #60A5FA;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Main Container */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1360px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 16px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 12px 10px;
                gap: 14px;
            }
        }

        /* Track Card & Visualizer */
        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .track-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent-gold), var(--accent-purple));
        }

        /* Style Version Switcher */
        .style-switcher {
            display: flex;
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 6px;
        }

        .style-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .style-btn.active.version-a {
            background: linear-gradient(135deg, #EF4444, #F59E0B);
            color: #FFFFFF;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
        }

        .style-btn.active.version-b {
            background: linear-gradient(135deg, #10B981, #06B6D4);
            color: #FFFFFF;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
        }

        /* Cover Art & Meta */
        .cover-meta-box {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cover-art-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            min-width: 140px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background: #0E1626;
        }

        .cover-art-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .cover-art-wrapper.playing img {
            animation: pulseArt 4s infinite ease-in-out;
        }

        @keyframes pulseArt {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .cover-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .meta-info {
            flex: 1;
            min-width: 0;
        }

        .meta-day-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-title {
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.3;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-theme {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-pill {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #CBD5E1;
        }

        /* Progress Bar & Timers */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar-container {
            position: relative;
            height: 10px;
            background: #1E293B;
            border-radius: 5px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
            border-radius: 5px;
            position: relative;
            transition: width 0.1s linear;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* Cycling Player Controls */
        .controls-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.08);
            border-color: var(--primary);
        }

        .btn-ctrl:active {
            transform: scale(0.95);
        }

        .btn-play-master {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, var(--primary), #1D4ED8);
            border: 2px solid #60A5FA;
            color: #FFFFFF;
            font-size: 26px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-play-master:hover {
            transform: scale(1.1);
            box-shadow: 0 0 28px rgba(37, 99, 235, 0.7);
        }

        .secondary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .mode-btn.active, .mode-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-color);
        }

        /* Lyrics Panel */
        .lyrics-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            height: 580px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
        }

        .lyrics-header {
            padding: 16px 20px;
            background: #0E1626;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lyrics-header h2 {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lyrics-view-toggle {
            font-size: 12px;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .lyrics-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 180px 24px 200px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .lyrics-scroll-area::-webkit-scrollbar {
            width: 6px;
        }

        .lyrics-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .lyric-line {
            font-size: 15px;
            color: var(--lyrics-inactive);
            line-height: 1.6;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .lyric-line:hover {
            color: #CBD5E1;
            background: rgba(255, 255, 255, 0.04);
        }

        .lyric-line.active {
            font-size: 19px;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid var(--accent-gold);
            border-right: 3px solid var(--accent-gold);
            transform: scale(1.04);
        }

        .lyric-marker {
            font-size: 12px;
            color: var(--accent-purple);
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Cycling Fullscreen Mode */
        body.cycling-fullscreen .main-content {
            max-width: 100%;
            height: 100vh;
            padding: 0;
            grid-template-columns: 1fr;
        }

        body.cycling-fullscreen header,
        body.cycling-fullscreen .day-ribbon-container,
        body.cycling-fullscreen .cover-meta-box,
        body.cycling-fullscreen .secondary-controls {
            display: none;
        }

        body.cycling-fullscreen .lyrics-card {
            height: calc(100vh - 140px);
            border-radius: 0;
            border: none;
        }

        body.cycling-fullscreen .lyric-line.active {
            font-size: 26px;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(19, 29, 47, 0.95);
            border: 1px solid var(--primary);
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 1000;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-box">
            <div class="brand-icon">🚴‍♂️</div>
            <div class="brand-title">
                <h1>2026 東京單車騎旅 19日主題曲播放器</h1>
                <p>38首 Suno AI 雙主唱雙風格 ✕ 毫秒級動態歌詞同步</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header" id="btn-fullscreen-mode" title="單車全螢幕專注模式">🚲 騎行全屏</button>
            <a href="suno_cycling_soundtrack_19days.html" class="btn-header">📖 完整詞庫</a>
            <a href="index.html" class="btn-header">🗺️ 19日行程</a>
        </div>
    </header>

    <!-- Day Navigation Ribbon -->
    <div class="day-ribbon-container">
        <div class="day-ribbon" id="day-ribbon">
            <!-- Dynamically generated Day 01 ~ Day 19 pills -->
        </div>
    </div>

    <!-- Main Content Grid -->
    <main class="main-content">
        
        <!-- Left: Track Card & Controls -->
        <section class="track-card">
            <!-- Style Version Switcher -->
            <div class="style-switcher">
                <button class="style-btn active version-a" id="btn-style-a" onclick="switchVersion('A')">
                    <span>⚡ A版 熱血搖滾</span>
                </button>
                <button class="style-btn version-b" id="btn-style-b" onclick="switchVersion('B')">
                    <span>🍃 B版 慢活民謠</span>
                </button>
            </div>

            <!-- Take Variation Selector (Take 1 / Take 2 / Take 3 / Take 4) -->
            <div class="take-switcher" id="take-switcher" style="display: flex; gap: 6px; flex-wrap: wrap;">
                <!-- Dynamically generated Take buttons -->
            </div>

            <!-- Cover & Metadata -->
            <div class="cover-meta-box">
                <div class="cover-art-wrapper" id="cover-wrapper">
                    <img id="cover-img" src="assets/default_cover.jpg" alt="Track Cover" onerror="this.src='https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=300&auto=format&fit=crop&q=80'">
                    <div class="cover-badge" id="cover-badge">Day 01</div>
                </div>
                <div class="meta-info">
                    <div class="meta-day-label" id="track-day-label">Day 1 (11/13 五)</div>
                    <h2 class="meta-title" id="track-title">世界線的起跑線</h2>
                    <p class="meta-theme" id="track-theme">《命運石之門》✕《飆速宅男》✕ 秋葉原出城至高尾山口</p>
                    <div class="meta-tags" id="track-tags">
                        <span class="tag-pill" id="style-tag">熱血搖滾</span>
                        <span class="tag-pill" id="vocal-tag">台日雙主唱</span>
                        <span class="tag-pill" id="bpm-tag">175 BPM</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar-container" id="progress-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="time-labels">
                    <span id="current-time">00:00</span>
                    <span id="total-duration">03:35</span>
                </div>
            </div>

            <!-- Cycling Controls -->
            <div class="controls-section">
                <button class="btn-ctrl" id="btn-prev" title="上一首 (Day -1)">⏮</button>
                <button class="btn-ctrl" id="btn-seek-back" title="倒退 10 秒">⏪</button>
                <button class="btn-ctrl btn-play-master" id="btn-play" title="播放 / 暫停">▶</button>
                <button class="btn-ctrl" id="btn-seek-fwd" title="快進 10 秒">⏩</button>
                <button class="btn-ctrl" id="btn-next" title="下一首 (Day +1)">⏭</button>
            </div>

            <!-- Secondary Controls -->
            <div class="secondary-controls">
                <button class="mode-btn" id="btn-play-mode" onclick="togglePlayMode()">
                    <span id="play-mode-icon">🔁</span> <span id="play-mode-text">順序循環</span>
                </button>
                <button class="mode-btn" id="btn-speed" onclick="toggleSpeed()">
                    <span>⚡ 1.0x</span>
                </button>
                <button class="mode-btn" id="btn-local-load" onclick="triggerLocalFileInput()">
                    <span>📂 本地MP3載入</span>
                </button>
                <input type="file" id="local-file-input" accept="audio/*,.lrc" multiple style="display: none;">
            </div>
        </section>

        <!-- Right: Dynamic Synced Lyrics Box -->
        <section class="lyrics-card">
            <div class="lyrics-header">
                <h2><span>📜</span> 動態歌詞同步 (點擊任意行跳轉)</h2>
                <div class="lyrics-view-toggle" id="btn-font-size" onclick="cycleLyricsFontSize()">🔠 字體切換</div>
            </div>
            <div class="lyrics-scroll-area" id="lyrics-container">
                <div class="lyric-line">載入歌詞中...</div>
            </div>
        </section>

    </main>

    <!-- Hidden Audio Element -->
    <audio id="audio-player" preload="auto"></audio>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // State
        let manifest = null;
        let currentDay = 1;
        let currentVersion = 'A';
        let currentTrack = null;
        let parsedLrc = []; // [{time: seconds, text: string, isMarker: bool}]
        let currentLrcIndex = -1;
        let isPlaying = false;
        let playModes = ['repeat-all', 'repeat-one', 'shuffle'];
        let currentPlayModeIdx = 0;
        let playbackSpeeds = [1.0, 1.25, 1.5, 0.8];
        let currentSpeedIdx = 0;
        let fontSizes = ['15px', '18px', '22px'];
        let currentFontIdx = 0;

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('btn-play');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const seekBackBtn = document.getElementById('btn-seek-back');
        const seekFwdBtn = document.getElementById('btn-seek-fwd');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const coverImg = document.getElementById('cover-img');
        const coverWrapper = document.getElementById('cover-wrapper');
        const coverBadge = document.getElementById('cover-badge');
        const trackTitle = document.getElementById('track-title');
        const trackDayLabel = document.getElementById('track-day-label');
        const trackTheme = document.getElementById('track-theme');
        const styleTag = document.getElementById('style-tag');
        const bpmTag = document.getElementById('bpm-tag');
        const dayRibbon = document.getElementById('day-ribbon');
        const lyricsContainer = document.getElementById('lyrics-container');
        const toastEl = document.getElementById('toast');

        // Show Toast
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 2500);
        }

        // PWA 已移除。舊版曾註冊 service worker 並快取 index.html，
        // 會讓造訪過的瀏覽器繼續被餵舊版行程，因此主動反註冊並清空快取。
        // 待所有裝置都清乾淨後（約數月），這段即可一併刪除。
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(rs => rs.forEach(r => r.unregister()))
                .catch(() => {});
        }
        if (window.caches && caches.keys) {
            caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
        }

        let currentTake = 1;

        // Load Manifest
        async function initApp() {
            try {
                const resp = await fetch('songs_manifest.json');
                manifest = await resp.json();
                renderDayRibbon();
                loadTrack(1, 'A', 1);
            } catch (err) {
                console.warn('[WARN] Manifest fetch error:', err);
            }
        }

        // Render Day Navigation Ribbon (Day 01 ~ 19 + Bonus)
        function renderDayRibbon() {
            dayRibbon.innerHTML = '';
            for (let d = 1; d <= 19; d++) {
                const btn = document.createElement('div');
                btn.className = `day-pill ${d === currentDay ? 'active' : ''}`;
                btn.textContent = `Day ${d < 10 ? '0' + d : d}`;
                btn.onclick = () => selectDay(d);
                dayRibbon.appendChild(btn);
            }

            // Bonus Tracks Pill
            const bonusBtn = document.createElement('div');
            bonusBtn.className = `day-pill ${currentDay === 99 ? 'active' : ''}`;
            bonusBtn.textContent = '🎁 加贈單曲';
            bonusBtn.onclick = () => selectDay(99);
            dayRibbon.appendChild(bonusBtn);
        }

        function selectDay(dayNum) {
            currentDay = dayNum;
            document.querySelectorAll('.day-pill').forEach((pill, idx) => {
                if (dayNum === 99) {
                    pill.classList.toggle('active', idx === 19);
                } else {
                    pill.classList.toggle('active', idx + 1 === dayNum);
                }
            });
            currentTake = 1;
            loadTrack(currentDay, currentVersion, currentTake);
        }

        function switchVersion(ver) {
            if (currentVersion === ver) return;
            currentVersion = ver;
            document.getElementById('btn-style-a').classList.toggle('active', ver === 'A');
            document.getElementById('btn-style-b').classList.toggle('active', ver === 'B');
            currentTake = 1;
            loadTrack(currentDay, currentVersion, currentTake);
        }

        function selectTake(takeNum) {
            currentTake = takeNum;
            loadTrack(currentDay, currentVersion, currentTake);
        }

        // Find and Load Track with Take variations
        function loadTrack(day, ver, take) {
            if (!manifest || !manifest.tracks) return;

            // Find matching tracks for current day & version
            const matchingTracks = manifest.tracks.filter(t => t.day === day && t.version === ver);
            
            let found = null;
            if (matchingTracks.length > 0) {
                found = matchingTracks.find(t => t.take === take) || matchingTracks[0];
            } else {
                // Fallback to any version of this day
                found = manifest.tracks.find(t => t.day === day) || manifest.tracks[0];
            }

            if (!found) return;
            currentTrack = found;
            currentTake = currentTrack.take || 1;

            // Render Take Switcher Buttons
            const takeSwitcher = document.getElementById('take-switcher');
            if (matchingTracks.length > 1) {
                takeSwitcher.style.display = 'flex';
                takeSwitcher.innerHTML = matchingTracks.map(t => `
                    <button class="style-btn ${t.take === currentTake ? 'active ' + (ver === 'A' ? 'version-a' : 'version-b') : ''}" 
                            style="padding: 6px 12px; font-size: 12px; border: 1px solid var(--border-color);"
                            onclick="selectTake(${t.take})">
                        ${t.take_str || 'Take ' + t.take} (${formatTime(t.duration)})
                    </button>
                `).join('');
            } else {
                takeSwitcher.style.display = 'none';
            }
            
            // Update UI
            trackTitle.textContent = currentTrack.title;
            trackDayLabel.textContent = currentTrack.day === 99 ? '🎁 旅程專屬單曲' : `Day ${currentTrack.day}`;
            trackTheme.textContent = currentTrack.theme || currentTrack.style_desc;
            styleTag.textContent = currentTrack.style_desc;
            coverBadge.textContent = `${currentTrack.day_str} ${currentTrack.version}版 ${currentTrack.take_str || ''}`;
            
            if (currentTrack.tags) {
                const bpmMatch = currentTrack.tags.match(/([0-9]{2,3})\s*BPM/i);
                bpmTag.textContent = bpmMatch ? `${bpmMatch[1]} BPM` : (ver === 'A' ? '175 BPM' : '120 BPM');
            }

            // Set Cover Art
            if (currentTrack.cover_file) {
                coverImg.src = currentTrack.cover_file;
            }

            // Set Audio Source
            const audioSrc = currentTrack.mp3_file;
            audio.src = audioSrc;
            audio.load();

            // Load LRC
            loadLyrics(currentTrack.lrc_file, currentTrack.prompt_lyrics);

            // Update MediaSession
            updateMediaSession(currentTrack);

            if (isPlaying) {
                audio.play().catch(e => console.log('Auto-play prevent:', e));
            }
        }

        // Fetch & Parse LRC
        async function loadLyrics(lrcUrl, fallbackText) {
            lyricsContainer.innerHTML = '<div class="lyric-line">載入動態歌詞中...</div>';
            parsedLrc = [];
            currentLrcIndex = -1;

            try {
                const resp = await fetch(lrcUrl);
                if (resp.ok) {
                    const text = await resp.text();
                    parseLrcText(text);
                    renderLyrics();
                    return;
                }
            } catch (e) {
                console.log('Fetching LRC network error:', e);
            }

            // Fallback
            if (fallbackText) {
                parseLrcText(fallbackText);
                renderLyrics();
            } else {
                lyricsContainer.innerHTML = '<div class="lyric-line">暫無動態歌詞</div>';
            }
        }

        function parseLrcText(lrcStr) {
            parsedLrc = [];
            const lines = lrcStr.split('\n');
            const timeReg = /\[(\d{2}):(\d{2}(?:\.\d+)?)\]/;

            lines.forEach((line, idx) => {
                const clean = line.trim();
                if (!clean) return;

                const match = timeReg.exec(clean);
                if (match) {
                    const min = parseInt(match[1], 10);
                    const sec = parseFloat(match[2]);
                    const time = min * 60 + sec;
                    const text = clean.replace(timeReg, '').trim();
                    const isMarker = text.startsWith('[') && text.endsWith(']');
                    if (text) {
                        parsedLrc.push({ time, text, isMarker, index: parsedLrc.length });
                    }
                } else if (!clean.startsWith('[ti:') && !clean.startsWith('[ar:') && !clean.startsWith('[al:')) {
                    // Plain text line without timestamp: interpolate
                    const estTime = idx * 4.5;
                    parsedLrc.push({ time: estTime, text: clean, isMarker: clean.startsWith('['), index: parsedLrc.length });
                }
            });

            parsedLrc.sort((a, b) => a.time - b.time);
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            if (parsedLrc.length === 0) {
                lyricsContainer.innerHTML = '<div class="lyric-line">暫無動態歌詞</div>';
                return;
            }

            parsedLrc.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${item.isMarker ? 'lyric-marker' : ''}`;
                div.textContent = item.text;
                div.dataset.index = index;
                div.onclick = () => seekToLyric(item.time);
                lyricsContainer.appendChild(div);
            });
        }

        function seekToLyric(seconds) {
            audio.currentTime = seconds;
            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                updatePlayState();
            }
            showToast(`跳轉至 ${formatTime(seconds)}`);
        }

        // Sync Lyrics with Audio TimeUpdate
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;

            const curr = audio.currentTime;
            const dur = audio.duration;

            // Progress bar
            const percent = (curr / dur) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(curr);
            totalDurationEl.textContent = formatTime(dur);

            // Sync LRC
            if (parsedLrc.length > 0) {
                let activeIdx = -1;
                for (let i = 0; i < parsedLrc.length; i++) {
                    if (curr >= parsedLrc[i].time) {
                        activeIdx = i;
                    } else {
                        break;
                    }
                }

                if (activeIdx !== currentLrcIndex && activeIdx !== -1) {
                    currentLrcIndex = activeIdx;
                    updateActiveLyricUI(activeIdx);
                }
            }
        });

        function updateActiveLyricUI(index) {
            const allLines = lyricsContainer.querySelectorAll('.lyric-line');
            allLines.forEach(l => l.classList.remove('active'));

            const activeLine = allLines[index];
            if (activeLine) {
                activeLine.classList.add('active');
                // Center scroll
                const containerHeight = lyricsContainer.clientHeight;
                const lineOffset = activeLine.offsetTop;
                const lineHeight = activeLine.clientHeight;
                lyricsContainer.scrollTo({
                    top: lineOffset - containerHeight / 2 + lineHeight / 2,
                    behavior: 'smooth'
                });
            }
        }

        // Play / Pause Toggle
        playBtn.addEventListener('click', togglePlay);

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayState();
                }).catch(err => {
                    console.log('Play error:', err);
                    showToast('請確認音訊檔案或點擊載入');
                });
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayState();
            }
        }

        function updatePlayState() {
            playBtn.textContent = isPlaying ? '⏸' : '▶';
            coverWrapper.classList.toggle('playing', isPlaying);
        }

        audio.addEventListener('play', () => { isPlaying = true; updatePlayState(); });
        audio.addEventListener('pause', () => { isPlaying = false; updatePlayState(); });
        audio.addEventListener('ended', onTrackEnded);

        // Previous / Next Controls
        prevBtn.addEventListener('click', () => {
            if (currentDay > 1) {
                selectDay(currentDay - 1);
            } else {
                selectDay(19);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentDay < 19) {
                selectDay(currentDay + 1);
            } else {
                selectDay(1);
            }
        });

        seekBackBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
            showToast('⏪ 倒退 10 秒');
        });

        seekFwdBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
            showToast('⏩ 快進 10 秒');
        });

        // Click on Progress Bar
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        });

        // Track Ended Behavior
        function onTrackEnded() {
            const mode = playModes[currentPlayModeIdx];
            if (mode === 'repeat-one') {
                audio.currentTime = 0;
                audio.play();
            } else if (mode === 'shuffle') {
                const randomDay = Math.floor(Math.random() * 19) + 1;
                const randomVer = Math.random() > 0.5 ? 'A' : 'B';
                currentVersion = randomVer;
                selectDay(randomDay);
            } else {
                // Repeat All: Next track
                if (currentVersion === 'A') {
                    switchVersion('B');
                } else {
                    currentVersion = 'A';
                    if (currentDay < 19) {
                        selectDay(currentDay + 1);
                    } else {
                        selectDay(1);
                    }
                }
            }
        }

        function togglePlayMode() {
            currentPlayModeIdx = (currentPlayModeIdx + 1) % playModes.length;
            const mode = playModes[currentPlayModeIdx];
            const icon = document.getElementById('play-mode-icon');
            const text = document.getElementById('play-mode-text');
            if (mode === 'repeat-all') {
                icon.textContent = '🔁';
                text.textContent = '全曲循環';
            } else if (mode === 'repeat-one') {
                icon.textContent = '🔂';
                text.textContent = '單曲循環';
            } else {
                icon.textContent = '🔀';
                text.textContent = '隨機播放';
            }
            showToast(`播放模式: ${text.textContent}`);
        }

        function toggleSpeed() {
            currentSpeedIdx = (currentSpeedIdx + 1) % playbackSpeeds.length;
            const speed = playbackSpeeds[currentSpeedIdx];
            audio.playbackRate = speed;
            document.getElementById('btn-speed').innerHTML = `<span>⚡ ${speed}x</span>`;
            showToast(`播放速度: ${speed}x`);
        }

        function cycleLyricsFontSize() {
            currentFontIdx = (currentFontIdx + 1) % fontSizes.length;
            const size = fontSizes[currentFontIdx];
            document.querySelectorAll('.lyric-line').forEach(line => {
                if (!line.classList.contains('active')) {
                    line.style.fontSize = size;
                }
            });
            showToast(`歌詞字體調整`);
        }

        // Fullscreen Mode for Bike Handlebar
        const fullscreenBtn = document.getElementById('btn-fullscreen-mode');
        fullscreenBtn.addEventListener('click', () => {
            document.body.classList.toggle('cycling-fullscreen');
            const isFull = document.body.classList.contains('cycling-fullscreen');
            fullscreenBtn.textContent = isFull ? '✕ 退出騎行' : '🚲 騎行全屏';
            showToast(isFull ? '已切換至單車高對比專注模式' : '已恢復標準模式');
        });

        // MediaSession API Integration (Lock Screen & Bluetooth Control)
        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.display_name,
                    artist: `2026 東京單車騎旅 (${track.version_name})`,
                    album: '東京・富士五湖・伊豆 19日主題曲全集',
                    artwork: [
                        { src: track.cover_file || 'assets/default_cover.jpg', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { prevBtn.click(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { nextBtn.click(); });
                navigator.mediaSession.setActionHandler('seekbackward', () => { seekBackBtn.click(); });
                navigator.mediaSession.setActionHandler('seekforward', () => { seekFwdBtn.click(); });
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.seekTime && audio.duration) {
                        audio.currentTime = details.seekTime;
                    }
                });
            }
        }

        // Local File Loader (Direct drag-drop or file picker)
        function triggerLocalFileInput() {
            document.getElementById('local-file-input').click();
        }

        document.getElementById('local-file-input').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            let loadedAudio = 0;
            files.forEach(file => {
                if (file.type.startsWith('audio/')) {
                    const objectUrl = URL.createObjectURL(file);
                    audio.src = objectUrl;
                    audio.play();
                    trackTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
                    showToast(`已載入本地音訊: ${file.name}`);
                    loadedAudio++;
                } else if (file.name.endsWith('.lrc')) {
                    const reader = new FileReader();
                    reader.onload = (re) => {
                        parseLrcText(re.target.result);
                        renderLyrics();
                        showToast(`已載入本地 LRC 歌詞: ${file.name}`);
                    };
                    reader.readAsText(file);
                }
            });
        });

        // Helpers
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
